<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="聪明蛋">
    <meta name="theme-color" content="#0f0f1a">
    <link rel="manifest" href="static/manifest.json">
    <link rel="apple-touch-icon" href="static/icon-192.png">
    <title>聪明蛋 - 你的AI助手</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --bg:#0f0f1a;--surface:#1a1a2e;--surface2:#222240;--text:#e0e0e8;
            --text2:#9090a8;--accent:#7c5cfc;--accent2:#5b3dd4;--user-bubble:#2d2d5e;
            --ai-bubble:#16162a;--border:#2a2a45;--r1:#f72585;--v3:#4cc9f0;
            --success:#4ade80;--warn:#fbbf24;--input-bg:#1a1a2e;
        }
        html,body{height:100%;overflow:hidden;font-family:"Courier New",monospace;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;image-rendering:pixelated}
        #app{display:flex;flex-direction:column;height:100%;max-width:700px;margin:0 auto;position:relative}

        header{padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--border);background:var(--surface);flex-shrink:0;z-index:10;flex-wrap:wrap}
        .avatar{width:36px;height:36px;border-radius:4px;background:linear-gradient(135deg,var(--accent),#4cc9f0);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;cursor:pointer;overflow:hidden;border:2px solid var(--border)}
        .avatar img{width:100%;height:100%;border-radius:2px;object-fit:cover;image-rendering:pixelated}
        .header-title{font-size:15px;font-weight:700;margin-right:auto;text-transform:uppercase;letter-spacing:1px}
        .header-badge{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;flex-shrink:0;letter-spacing:.5px}
        .badge-v3{background:#4cc9f020;color:var(--v3);border:2px solid #4cc9f040}
        .badge-r1{background:#f7258520;color:var(--r1);border:2px solid #f7258540}
        .personality-select{font-size:11px;padding:4px 6px;border-radius:4px;border:2px solid var(--border);background:var(--surface2);color:var(--text);outline:none;cursor:pointer;max-width:80px;font-family:inherit}
        .icon-btn{width:32px;height:32px;border-radius:4px;border:2px solid var(--border);background:var(--surface2);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
        .icon-btn:active{background:var(--accent);box-shadow:2px 2px 0 0 rgba(0,0,0,.3)}
        .icon-btn .dot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:0;background:var(--accent)}

        .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;animation:fadeIn .15s ease}
        .sidebar-overlay.hidden{display:none}
        .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;max-width:85vw;background:var(--surface);z-index:151;display:flex;flex-direction:column;border-right:3px solid var(--border);animation:slideLeft .2s steps(8)}
        @keyframes slideLeft{from{transform:translateX(-100%)}to{transform:translateX(0)}}
        .sidebar-header{padding:12px 14px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:8px}
        .sidebar-header h3{font-size:15px;flex:1;letter-spacing:.5px}
        .sidebar-list{flex:1;overflow-y:auto;padding:6px}
        .conv-item{padding:10px 12px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .1s;margin-bottom:2px;position:relative;border:2px solid transparent}
        .conv-item:hover,.conv-item.active{background:var(--surface2)}
        .conv-item.active{border-color:var(--accent);box-shadow:3px 3px 0 0 rgba(0,0,0,.2)}
        .conv-item .conv-icon{font-size:16px;flex-shrink:0}
        .conv-item .conv-info{flex:1;min-width:0}
        .conv-item .conv-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .conv-item .conv-meta{font-size:10px;color:var(--text2)}
        .conv-item .conv-del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;padding:2px}
        .sidebar-footer{padding:10px 14px;border-top:2px solid var(--border)}

        #chat-container{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
        @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeInLeft{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
        @keyframes fadeInRight{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
        .message{display:flex;gap:6px;padding:2px 8px;animation:fadeIn .2s steps(6)}
        .message.user{justify-content:flex-end;animation-name:fadeInRight}
        .message.assistant{justify-content:flex-start;animation-name:fadeInLeft}
        .msg-avatar{width:30px;height:30px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;position:relative;top:2px;border:2px solid var(--border)}
        .message.user .msg-avatar{background:linear-gradient(135deg,#4cc9f0,#3b82f6);box-shadow:2px 2px 0 0 rgba(76,201,240,.3)}
        .message.assistant .msg-avatar{background:linear-gradient(135deg,#7c5cfc,#f72585);box-shadow:2px 2px 0 0 rgba(124,92,252,.3)}
        .msg-bubble{padding:8px 12px;border-radius:6px;font-size:13.5px;line-height:1.5;word-break:break-word;max-width:80%;position:relative;box-shadow:3px 3px 0 0 rgba(0,0,0,.15);border:2px solid var(--border)}
        .message.user .msg-bubble{background:var(--user-bubble);border-bottom-right-radius:2px}
        .message.assistant .msg-bubble{background:var(--ai-bubble);border-bottom-left-radius:2px}
        .msg-bubble .msg-time{font-size:10px;color:var(--text2);margin-top:5px;opacity:.7;user-select:none;letter-spacing:.5px}
        .msg-bubble .msg-actions{display:flex;gap:4px;margin-top:4px;justify-content:flex-end}
        .msg-bubble .msg-act-btn{width:26px;height:26px;border-radius:4px;border:2px solid var(--border);background:var(--surface2);color:var(--text2);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0}
        .message:hover .msg-act-btn{opacity:1}
        .msg-bubble .msg-act-btn:active{background:var(--accent);color:#fff;box-shadow:2px 2px 0 0 rgba(0,0,0,.3)}
        .msg-bubble p{margin:0 0 4px}.msg-bubble p:last-child{margin:0}
        .msg-bubble code{background:rgba(255,255,255,.08);padding:2px 5px;border-radius:2px;font-size:12px;border:1px solid var(--border)}
        .msg-bubble pre{background:rgba(0,0,0,.3);padding:10px 12px;border-radius:4px;overflow-x:auto;margin:5px 0;font-size:12px;border:2px solid var(--border)}
        .msg-bubble a{color:var(--accent);text-decoration:underline}
        .msg-bubble img{border-radius:4px;max-width:100%;margin:4px 0;cursor:pointer;border:2px solid var(--border)}
        .msg-bubble .img-loading{display:flex;align-items:center;gap:8px;padding:10px;background:var(--surface2);border-radius:4px;font-size:12px;color:var(--text2);margin:4px 0;border:2px solid var(--border)}
        .typing-dots{display:flex;gap:4px;padding:3px 0}.typing-dots span{width:6px;height:6px;border-radius:0;background:var(--text2);animation:bounce 1.2s infinite steps(4)}.typing-dots span:nth-child(2){animation-delay:.15s}.typing-dots span:nth-child(3){animation-delay:.3s}
        @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

        .welcome{text-align:center;padding:30px 12px 14px;color:var(--text2)}
        .welcome-icon{font-size:48px;margin-bottom:8px}
        .welcome-icon img{border-radius:4px;border:3px solid var(--border);box-shadow:4px 4px 0 0 rgba(0,0,0,.2)}
        .welcome h2{font-size:16px;color:var(--text);margin-bottom:4px;line-height:1.5;letter-spacing:.5px}
        .welcome p{font-size:12px;line-height:1.4;letter-spacing:.5px}
        .quick-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
        .quick-btn{padding:8px 12px;border-radius:4px;border:2px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;box-shadow:2px 2px 0 0 rgba(0,0,0,.15);letter-spacing:.5px}
        .quick-btn:active{background:var(--accent);border-color:var(--accent);box-shadow:none;transform:translate(2px,2px)}

        .weather-card{background:var(--surface2);border-radius:4px;padding:12px;margin:4px 0;border:2px solid var(--border);box-shadow:3px 3px 0 0 rgba(0,0,0,.15)}
        .weather-card .wcity{font-size:15px;font-weight:600;margin-bottom:6px}
        .weather-card .wmain{display:flex;align-items:center;gap:12px}
        .weather-card .wtemp{font-size:36px;font-weight:700;color:var(--accent)}
        .weather-card .winfo{font-size:13px;color:var(--text2);line-height:1.6}
        .weather-card .wforecast{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
        .weather-card .wfc{text-align:center;font-size:11px;color:var(--text2);flex-shrink:0;min-width:44px}
        .weather-card .wfc .wfct{font-size:13px;color:var(--text);font-weight:500}

        .hot-news-card{background:var(--surface2);border-radius:4px;padding:14px;margin:6px 0;border:2px solid var(--border);box-shadow:3px 3px 0 0 rgba(0,0,0,.15)}
        .hot-news-card .hn-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
        .hot-news-card .hn-header .hn-icon{font-size:22px}
        .hot-news-card .hn-header .hn-title{font-size:15px;font-weight:600;color:var(--text);letter-spacing:.5px}
        .hot-news-card .hn-source{font-size:11px;color:var(--text2)}
        .hot-news-card .hn-list{list-style:none;padding:0;margin:0}
        .hot-news-card .hn-item{padding:8px 0;border-bottom:2px solid var(--border);display:flex;gap:8px;font-size:13.5px;line-height:1.4}
        .hot-news-card .hn-item:last-child{border-bottom:none;padding-bottom:0}
        .hot-news-card .hn-rank{width:22px;height:22px;border-radius:2px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .hot-news-card .hn-rank.r1{background:#f72585}.hot-news-card .hn-rank.r2{background:#f59e4b}.hot-news-card .hn-rank.r3{background:#fbbf24}
        .hot-news-card .hn-text{flex:1;color:var(--text)}
        .hot-news-card .hn-hot{font-size:10px;color:var(--text2);flex-shrink:0}
        .hot-news-card .hn-loading{text-align:center;color:var(--text2);padding:12px;font-size:13px}

        /* Greeting */
        .greeting-card{background:linear-gradient(135deg,var(--surface2),var(--surface));border-radius:4px;padding:14px 16px;text-align:center;margin-bottom:10px;border:2px solid var(--border);box-shadow:3px 3px 0 0 rgba(0,0,0,.15)}
        .greeting-card .greet-emoji{font-size:32px;margin-bottom:4px}
        .greeting-card .greet-msg{font-size:15px;font-weight:600;color:var(--text)}
        .greeting-card .greet-date{font-size:12px;color:var(--text2);margin-top:3px}

        /* Game selector */
        .game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
        .game-option{padding:14px 6px;border-radius:4px;border:2px solid var(--border);background:var(--bg);text-align:center;cursor:pointer;transition:all .15s;box-shadow:2px 2px 0 0 rgba(0,0,0,.15)}
        .game-option:active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none;transform:translate(2px,2px)}
        .game-option .game-icon{font-size:28px;display:block;margin-bottom:6px}
        .game-option .game-name{font-size:12.5px;font-weight:500}
        .game-option .game-desc{font-size:10px;color:var(--text2);margin-top:2px}
        .game-option:active .game-desc{color:rgba(255,255,255,.7)}
        .game-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;border:2px solid var(--border);background:var(--surface2);margin-bottom:6px;font-size:12px}
        .game-bar.hidden{display:none}
        .game-bar .game-label{flex:1;color:var(--accent);font-weight:500}
        .game-bar button{background:var(--border);border:2px solid var(--border);color:var(--text);padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer;box-shadow:2px 2px 0 0 rgba(0,0,0,.15);font-family:inherit}

        /* Translator */
        .translator{text-align:center}
        .trans-langs{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px}
        .trans-lang{font-size:15px;padding:8px 12px;border-radius:4px;border:2px solid var(--border);background:var(--bg);color:var(--text);outline:none;text-align:center;font-family:inherit;cursor:pointer;max-width:130px}
        .trans-arrow{font-size:20px;color:var(--accent);cursor:pointer;font-weight:700;flex-shrink:0}
        .trans-hint{font-size:12px;color:var(--text2);margin:6px 0}
        .trans-results{background:var(--bg);border-radius:4px;padding:14px;text-align:left;margin:10px 0;min-height:40px;display:none;border:2px solid var(--border)}
        .trans-results.visible{display:block}
        .trans-orig{font-size:14px;color:var(--text2);margin-bottom:3px}
        .trans-trans{font-size:16px;color:var(--text);font-weight:500}
        .trans-quick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
        .trans-quick button{font-size:11px;padding:5px 10px;border-radius:4px;border:2px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;white-space:nowrap;font-family:inherit;box-shadow:2px 2px 0 0 rgba(0,0,0,.15)}
        .trans-quick button:active{background:var(--accent);color:#fff;box-shadow:none;transform:translate(2px,2px)}

        /* Dino Game */
        #dino-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:170;display:flex;align-items:center;justify-content:center;flex-direction:column}
        #dino-overlay.hidden{display:none}
        #dino-canvas{border:3px solid var(--border);border-radius:4px;background:#1a1a2e;max-width:95vw;box-shadow:4px 4px 0 0 rgba(0,0,0,.3)}
        #dino-score{color:var(--text);font-size:18px;font-weight:600;margin-bottom:8px;letter-spacing:1px}
        #dino-hint{color:var(--text2);font-size:13px;margin-top:10px}
        #dino-close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;z-index:171}

        /* Fortune */
        .fortune-card{background:linear-gradient(135deg,#1a1030,#2d1050);border-radius:4px;padding:16px;text-align:center;border:2px solid #6030a0;margin:4px 0;box-shadow:3px 3px 0 0 rgba(0,0,0,.2)}
        .fortune-stars{font-size:28px;letter-spacing:4px;margin-bottom:6px}
        .fortune-text{font-size:14px;color:var(--text);margin-bottom:8px;line-height:1.5}
        .fortune-tip{font-size:12px;color:var(--text2)}
        .fortune-extras{display:flex;justify-content:center;gap:20px;margin-top:8px;font-size:11px;color:var(--text2)}
        .fortune-extras span{color:var(--accent);font-weight:600}

        /* Decider */
        .decide-btns{display:flex;gap:10px;margin-bottom:12px}
        .decide-btn{flex:1;padding:16px 8px;border-radius:4px;border:2px solid var(--border);background:var(--bg);text-align:center;cursor:pointer;transition:all .15s;box-shadow:2px 2px 0 0 rgba(0,0,0,.15)}
        .decide-btn:active{background:var(--accent);border-color:var(--accent);box-shadow:none;transform:translate(2px,2px)}
        .decide-btn .decide-icon{font-size:30px;display:block;margin-bottom:4px}
        .decide-btn .decide-label{font-size:12px;font-weight:500}
        .decide-result{text-align:center;padding:14px;background:var(--bg);border-radius:4px;border:2px solid var(--border);font-size:22px;font-weight:700;color:var(--accent);margin-top:10px;animation:fadeIn .3s ease}
        .decide-result.hidden{display:none}

        #input-area{padding:10px 14px 16px;border-top:2px solid var(--border);background:var(--surface);flex-shrink:0}
        .input-row{display:flex;gap:8px;align-items:flex-end}
        #msg-input{flex:1;padding:10px 14px;border-radius:4px;border:2px solid var(--border);background:var(--input-bg,var(--surface));color:var(--text);font-size:14.5px;resize:none;outline:none;max-height:110px;line-height:1.4;font-family:inherit;transition:border-color .2s}
        #msg-input:focus{border-color:var(--accent)}
        .mode-indicator{font-size:11px;color:var(--text2);text-align:center;margin-bottom:4px;min-height:16px;transition:all .3s;letter-spacing:.5px}
        #send-btn{width:40px;height:40px;border-radius:4px;border:2px solid var(--accent2);background:var(--accent);color:#fff;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:2px 2px 0 0 rgba(0,0,0,.2)}
        #send-btn:active{background:var(--accent2);box-shadow:none;transform:translate(2px,2px)}
        #send-btn:disabled{background:var(--border);border-color:var(--border);cursor:not-allowed;box-shadow:none}
        #cam-btn{width:40px;height:40px;border-radius:4px;border:2px solid var(--border);background:var(--surface2);color:var(--text);font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:2px 2px 0 0 rgba(0,0,0,.15)}
        #cam-btn:active{background:var(--accent);box-shadow:none;transform:translate(2px,2px)}
        .msg-bubble .photo-preview{max-width:200px;border-radius:4px;margin-bottom:6px;display:block;border:2px solid var(--border)}

        .panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadeIn .2s ease}
        .panel-overlay.hidden{display:none}
        .panel{background:var(--surface);border-radius:4px 4px 0 0;padding:0;width:100%;max-width:500px;max-height:85vh;display:flex;flex-direction:column;animation:slideUp .3s ease;border:2px solid var(--border);border-bottom:none}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .panel-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);padding:0 16px;flex-shrink:0;overflow-x:auto}
        .panel-tab{padding:12px 12px;border:none;background:none;color:var(--text2);font-size:13px;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;font-family:inherit;white-space:nowrap;flex-shrink:0}
        .panel-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
        .panel-body{flex:1;overflow-y:auto;padding:14px 16px 20px}
        .panel h4{font-size:14px;margin-bottom:10px;color:var(--text)}
        .panel .empty{text-align:center;color:var(--text2);font-size:13px;padding:30px 0}

        .tool-form{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
        .tool-form input,.tool-form select{flex:1;min-width:60px;padding:8px 10px;border-radius:4px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;outline:none}
        .tool-form input:focus{border-color:var(--accent)}
        .tool-form button{padding:8px 14px;border-radius:4px;border:none;background:var(--accent);color:#fff;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;box-shadow:2px 2px 0 0 rgba(0,0,0,.15)}
        .tool-form button:active{box-shadow:none;transform:translate(2px,2px)}
        .tool-list{list-style:none;display:flex;flex-direction:column;gap:6px}
        .tool-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:4px;background:var(--bg);font-size:13px;border:2px solid var(--border)}
        .tool-item .item-text{flex:1;color:var(--text)}
        .tool-item .item-meta{font-size:11px;color:var(--text2);white-space:nowrap}
        .tool-item .item-del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px;padding:0 2px}
        .tool-item.done .item-text{text-decoration:line-through;opacity:.5}
        .summary-row{display:flex;gap:10px;margin-bottom:12px;font-size:13px;color:var(--text2)}
        .summary-row strong{color:var(--text)}

        .mem-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:4px;background:var(--bg);font-size:12.5px;margin-bottom:6px;border:2px solid var(--border)}
        .mem-item .mem-text{flex:1;color:var(--text)}
        .mem-item button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:15px}

        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadeIn .2s ease}
        .modal-overlay.hidden{display:none}
        .modal{background:var(--surface);border-radius:4px 4px 0 0;padding:20px 20px 30px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:slideUp .3s ease;border:2px solid var(--border);border-bottom:none}
        .modal h3{font-size:17px;margin-bottom:14px;text-align:center;letter-spacing:.5px}
        .modal label{font-size:12.5px;color:var(--text2);display:block;margin-bottom:5px;margin-top:10px}
        .modal label:first-of-type{margin-top:0}
        .modal input,.modal textarea,.modal select{width:100%;padding:9px 12px;border-radius:4px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:13.5px;font-family:inherit;outline:none;margin-bottom:10px;resize:vertical}
        .modal input:focus,.modal select:focus{border-color:var(--accent)}
        .modal .btn-row{display:flex;gap:10px;margin-top:6px}
        .modal .btn{flex:1;padding:11px;border-radius:4px;border:none;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;box-shadow:2px 2px 0 0 rgba(0,0,0,.15)}
        .modal .btn:active{box-shadow:none;transform:translate(2px,2px)}
        .btn-primary{background:var(--accent);color:#fff}.btn-primary:active{background:var(--accent2)}
        .btn-secondary{background:var(--surface2);color:var(--text);border:2px solid var(--border)}.btn-secondary:active{background:var(--border)}
        .tip{font-size:11px;color:var(--text2);text-align:center;margin-top:10px}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:9px 18px;border-radius:4px;border:2px solid var(--accent2);font-size:13.5px;z-index:200;animation:fadeIn .3s ease;pointer-events:none}

        .theme-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
        .theme-dot{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s;position:relative}
        .theme-dot.active{border-color:var(--text);box-shadow:0 0 12px rgba(255,255,255,.2)}
        .theme-dot::after{content:attr(data-label);position:absolute;top:40px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text2);white-space:nowrap}

        ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    </style>
</head>
<body>
<div id="app">
    <header>
        <button class="icon-btn" onclick="toggleSidebar()" title="对话列表">☰</button>

    <div id="chat-container">

    <!-- Game Selector -->

            <div style="display:flex;gap:6px;margin-top:6px">
                <input type="text" id="trans-text-input" placeholder="输入要翻译的文字..." style="flex:1;padding:10px 12px;border-radius:4px;border:2px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px" onkeydown="if(event.key==='Enter')transText()">
                <button class="btn btn-primary" onclick="transText()" style="padding:10px 16px;flex-shrink:0">翻译</button>
            </div>
            <div class="trans-results" id="trans-results">
                <div class="trans-orig" id="trans-orig"></div>

        </div>

    <!-- Decider Modal -->
    <div class="modal-overlay hidden" id="decider-modal">
        <div class="modal">
            <h3>🤔 做决定</h3>
            <div class="decide-btns">
                <div class="decide-btn" onclick="doDecide('coin')">
                    <span class="decide-icon">🪙</span>
                    <span class="decide-label">掷硬币</span>
                </div>
                <div class="decide-btn" onclick="doDecide('dice')">
                    <span class="decide-icon">🎲</span>
                    <span class="decide-label">掷骰子</span>
                </div>
                <div class="decide-btn" onclick="promptPick()">
                    <span class="decide-icon">🎯</span>

                </div>

    <!-- Dino Game Overlay -->

        <button id="dino-close" onclick="stopDinoGame()">✕</button>
        <div id="dino-score">🦖 得分：0</div>

        <div id="dino-hint">👆 点击画面跳跃 | 🏆 最高分：<span id="dino-best">0</span></div>
    </div>

    <div id="input-area">
        <div class="game-bar hidden" id="game-bar">
            <span class="game-label" id="game-label"></span>
            <button onclick="stopGame()">结束游戏</button>

                <button class="panel-tab" onclick="switchToolTab(this,'todo')">✅ 待办</button>

                <option value="on">开启（遇到数学/代码自动切V4 Pro）</option>

                <button class="btn btn-primary" onclick="saveSettings()">保存</button>

<script>
// ============ CONSTANTS ============
const DEEPSEEK_API = "https://api.deepseek.com/v1/chat/completions";
const WEATHER_API = "https://wttr.in";

// ============ THEMES ============
const THEMES = {
    purple:  {name:'魅紫',colors:{bg:'#0f0f1a',surface:'#1a1a2e',surface2:'#222240',text:'#e0e0e8',text2:'#9090a8',accent:'#7c5cfc',accent2:'#5b3dd4',userBubble:'#2d2d5e',aiBubble:'#16162a',border:'#2a2a45'}},
    blue:    {name:'海蓝',colors:{bg:'#0a1628',surface:'#132238',surface2:'#1a3050',text:'#d8e8f8',text2:'#7a9ab8',accent:'#3b9eff',accent2:'#2580d8',userBubble:'#1a3050',aiBubble:'#0f1e30',border:'#1e3858'}},
    green:   {name:'翡翠',colors:{bg:'#0a1a14',surface:'#0f2820',surface2:'#15382e',text:'#c8e8d8',text2:'#6a9880',accent:'#2dd4a8',accent2:'#20a880',userBubble:'#15382e',aiBubble:'#0a2016',border:'#1a4030'}},
    orange:  {name:'暖橙',colors:{bg:'#1a1208',surface:'#281c10',surface2:'#382818',text:'#e8dcc8',text2:'#988a6a',accent:'#f59e4b',accent2:'#d87828',userBubble:'#382818',aiBubble:'#201408',border:'#403020'}},
    pink:    {name:'桃粉',colors:{bg:'#1a0f18',surface:'#281624',surface2:'#381e30',text:'#e8c8d8',text2:'#986a80',accent:'#f472b6',accent2:'#d45090',userBubble:'#381e30',aiBubble:'#201018',border:'#402838'}},
    mono:    {name:'极简',colors:{bg:'#111111',surface:'#1a1a1a',surface2:'#252525',text:'#d0d0d0',text2:'#808080',accent:'#909090',accent2:'#686868',userBubble:'#252525',aiBubble:'#161616',border:'#2a2a2a'}},
};
let currentTheme = localStorage.getItem("ld_theme")||"purple";

function applyTheme(key){
    currentTheme = key;
    const c = THEMES[key].colors;
    const root = document.documentElement;
    root.style.setProperty("--bg", c.bg); root.style.setProperty("--surface", c.surface);
    root.style.setProperty("--surface2", c.surface2); root.style.setProperty("--text", c.text);
    root.style.setProperty("--text2", c.text2); root.style.setProperty("--accent", c.accent);
    root.style.setProperty("--accent2", c.accent2); root.style.setProperty("--user-bubble", c.userBubble);
    root.style.setProperty("--ai-bubble", c.aiBubble); root.style.setProperty("--border", c.border);
    root.style.setProperty("--input-bg", c.surface);
    document.querySelector('meta[name="theme-color"]').content = c.bg;
    localStorage.setItem("ld_theme", key);
    renderThemeGrid();
}

function renderThemeGrid(){
    const grid = document.getElementById("theme-grid");
    if(!grid) return;
    grid.innerHTML = Object.entries(THEMES).map(([k,v])=>{
        const active = k===currentTheme ? " active" : "";
        const c = v.colors;
        return `<div class="theme-dot${active}" data-label="${v.name}" style="background:linear-gradient(135deg,${c.accent},${c.bg})" onclick="applyTheme('${k}')"></div>`;
    }).join("");
}

// ============ GREETING ============
function renderGreeting(){
    const card = document.getElementById("greeting-card");
    if(!card) return;
    const now = new Date();
    const h = now.getHours();
    let emoji, msg;
    if(h>=5 && h<9){emoji='🌅';msg='早安！新的一天，元气满满~';}
    else if(h>=9 && h<12){emoji='☀️';msg='上午好！精神饱满地开始吧！';}
    else if(h>=12 && h<17){emoji='🌤️';msg='下午好！喝杯茶休息一下~';}
    else if(h>=17 && h<22){emoji='🌙';msg='晚上好！今天辛苦了~';}
    else{emoji='🌛';msg='夜深了，早点休息哦~';}
    const days=['日','一','二','三','四','五','六'];
    const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${days[now.getDay()]}`;
    card.innerHTML = `<div class="greet-emoji">${emoji}</div><div class="greet-msg">${msg}</div><div class="greet-date">${dateStr}</div>`;
}

// ============ PERSONALITIES ============
const PERSONALITIES = {
    default:  {name:'默认',icon:'🤷🏻‍♂️',prompt:'你是聪明蛋，用户的好朋友和全能助手。用中文回复，语气友好温暖，像朋友聊天一样。回复简洁有用。'},
    sassy:    {name:'毒舌',icon:'🔥',prompt:'你是聪明蛋，一个毒舌吐槽大师。说话犀利幽默一针见血，带点损友的感觉但不伤感情。用中文回复，可以毒舌但要有趣。'},
    warm:     {name:'暖心',icon:'💖',prompt:'你是聪明蛋，一个超级温柔暖心的朋友。说话像冬日热可可，永远鼓励和支持用户。多用温暖的话、可爱的语气词。用中文回复。'},
    dongbei:  {name:'东北',icon:'🎤',prompt:'你是聪明蛋，一个地道的东北人。说话带东北味儿，可以加"老"、"嘎嘎"、"整"、"咋地"、"嗯呐"这些东北词。幽默豪爽，像东北哥姐们儿唠嗑。用中文回复。'},
    pro:      {name:'顾问',icon:'💼',prompt:'你是聪明蛋，一个专业高效的工作/学习顾问。说话简洁干练，直击要点，给出可执行的建议。像麦肯锡顾问一样思考。用中文回复。'},
};

// ============ STATE ============
let conversations = [], activeCid = null;
let apiKey = "", model = "deepseek-v4-flash", systemPrompt = "";
let currentPersonality = "default", smartSwitch = true, isLoading = false;
let journal = [], expenses = [], todos = [], memories = [];
let activeGame = null; // null | 'guess' | 'idiom' | 'riddle'
let photoData = null; // { base64, mime } for pending photo

// ============ CONVERSATIONS ============
function loadConvs(){
    try{ conversations = JSON.parse(localStorage.getItem("ld_conversations")||"[]"); }catch(e){ conversations = []; }
    if(conversations.length===0){
        const oldMsgs = localStorage.getItem("ld_messages");
        if(oldMsgs){
            try{
                const msgs = JSON.parse(oldMsgs);
                if(msgs.length>0){
                    conversations = [{id:Date.now(),title:"旧对话",createdAt:new Date().toISOString(),messages:msgs.slice(-100)}];
                    activeCid = conversations[0].id;
                    saveConvs(); localStorage.removeItem("ld_messages"); return;
                }
            }catch(e){}
        }
    }
    activeCid = localStorage.getItem("ld_active_cid");
    if(activeCid) activeCid = parseInt(activeCid);
    if(!activeCid || !conversations.find(c=>c.id===activeCid)){
        if(conversations.length>0) activeCid = conversations[0].id;
        else { activeCid = null; conversations = []; saveConvs(); }
    }
}

function saveConvs(){
    conversations.forEach(c=>{ if(c.messages.length>100) c.messages = c.messages.slice(-100); });
    if(conversations.length>50) conversations = conversations.slice(-50);
    localStorage.setItem("ld_conversations", JSON.stringify(conversations));
    if(activeCid) localStorage.setItem("ld_active_cid", activeCid);
}

function getActiveConv(){ return activeCid ? conversations.find(c=>c.id===activeCid) : null; }
function getActiveMessages(){ const conv = getActiveConv(); return conv ? conv.messages : []; }

function newConversation(){
    const conv = {id:Date.now(),title:"新对话",createdAt:new Date().toISOString(),messages:[]};
    conversations.unshift(conv); activeCid = conv.id;
    saveConvs(); renderSidebar(); renderChat(); closeSidebar(); showToast("新建对话 ✓");
}

function switchConversation(cid){ activeCid = cid; saveConvs(); renderSidebar(); renderChat(); closeSidebar(); updateBadge(); }

function deleteConversation(cid, e){
    if(e) e.stopPropagation();
    if(!confirm("确定要删除这个对话吗？")) return;
    conversations = conversations.filter(c=>c.id!==cid);
    if(activeCid===cid) activeCid = conversations.length>0 ? conversations[0].id : null;
    saveConvs(); renderSidebar(); renderChat();
}

function deleteCurrentConv(){
    if(!activeCid) return;
    if(conversations.length <= 1){ showToast("至少保留一个对话"); return; }
    deleteConversation(activeCid);
}

function renameConversation(cid, newTitle){
    const conv = conversations.find(c=>c.id===cid);
    if(conv){ conv.title = newTitle; saveConvs(); renderSidebar(); }
}

function autoTitle(text){ return text.replace(/\n/g," ").slice(0,20) + (text.length>20?"...":""); }

function renderSidebar(){
    const list = document.getElementById("sidebar-list");
    if(!list) return;
    if(conversations.length===0){ list.innerHTML = '<div class="empty" style="padding:30px 0">还没有对话</div>'; return; }
    list.innerHTML = conversations.map(c=>{
        const active = c.id===activeCid ? " active" : "";
        return `<div class="conv-item${active}" onclick="switchConversation(${c.id})">

// ============ WEATHER ============
const WEATHER_KW = /天气|下雨|下雪|刮风|温度|气温|热不热|冷不冷|穿什么衣服|带伞|空气质量|雾霾|台风/;
const CITY_KW = /(.{1,6})的天气|(.{1,6})天气|(.{1,6})冷不冷|(.{1,6})热不热|(.{1,6})温度|(.{1,6})气温|(.{1,6})下雨|(.{1,6})下雪|(.{1,6})穿什么/;

function extractCity(text){
    for(const m of text.matchAll(/北京|上海|广州|深圳|杭州|成都|重庆|武汉|西安|南京|天津|苏州|长沙|郑州|东莞|青岛|沈阳|宁波|昆明|大连|厦门|合肥|佛山|福州|哈尔滨|济南|温州|长春|石家庄|常州|泉州|南宁|贵阳|南昌|太原|烟台|嘉兴|南通|金华|珠海|惠州|徐州|海口|乌鲁木齐|兰州|呼和浩特|银川|西宁|拉萨|三亚|桂林/g)){
        return m[0];
    }
    const m = text.match(CITY_KW);
    if(m){ for(let i=1;i<=9;i++){ if(m[i]) return m[i]; } }
    return null;
}

async function checkWeather(text){
    if(!WEATHER_KW.test(text)) return null;
    const city = extractCity(text);
    if(!city) return null;
    try{
        const resp = await fetch(`${WEATHER_API}/${encodeURIComponent(city)}?format=j1`);
        if(!resp.ok) return null;
        const data = await resp.json();
        const cur = data.current_condition[0];
        const forecast = data.weather[0].hourly;
        return {
            city,
            temp: cur.temp_C, feels_like: cur.FeelsLikeC, humidity: cur.humidity,
            desc: cur.weatherDesc[0].value, wind: cur.windspeedKmph,
            forecast: forecast.filter((_,i)=>i%4===0).slice(0,6).map(h=>({time:h.time,temp:h.tempC,desc:h.weatherDesc[0].value})),
        };
    }catch(e){ return null; }
}

function renderWeatherCard(w){
    let fc = "";
    if(w.forecast && w.forecast.length>0){
        fc = '<div class="wforecast">'+w.forecast.map(f=>`<div class="wfc"><div>${f.time}</div><div class="wfct">${f.temp}°C</div><div>${f.desc}</div></div>`).join("")+'</div>';
    }
    return `<div class="weather-card">
        <div class="wcity">📍 ${esc(w.city)}</div>
        <div class="wmain"><div class="wtemp">${w.temp}°C</div><div class="winfo"><div>体感 ${w.feels_like}°C | 湿度 ${w.humidity}%</div><div>${w.desc} | 风速 ${w.wind}km/h</div></div></div>
        ${fc}
    </div>`;
}

// ============ DEEPSEEK API (direct call) ============
async function callDeepSeek(apiKey, model, messages, systemText, imageBase64){
    let dsMessages = [{"role":"system","content":systemText}];
    for(const m of messages){
        if(m.image){
            dsMessages.push({"role":m.role,"content":[
                {"type":"image_url","image_url":{"url":m.image}},
                {"type":"text","text":m.content||"请描述这张图片"}
            ]});
        } else {
            dsMessages.push({"role":m.role,"content":m.content});
        }
    }

    const body = {model, messages: dsMessages, max_tokens: 4096};

    // V4 Pro: enable deep thinking (replaces old R1)
    if(model === "deepseek-v4-pro"){
        body.thinking = {type: "enabled"};
        body.reasoning_effort = "high";
    } else {
        body.temperature = 0.7;
    }

    const resp = await fetch(DEEPSEEK_API, {
        method:"POST",
        headers:{"Authorization":`Bearer ${apiKey}`,"Content-Type":"application/json"},
        body:JSON.stringify(body),
    });

    if(!resp.ok){
        const err = await resp.json().catch(()=>({error:{message:"未知错误"}}));
        throw new Error(err.error?.message || `API 错误 (${resp.status})`);
    }

    const data = await resp.json();
    return data.choices[0].message.content;
}

        });

function fmtTime(ts){ const d=new Date(ts),n=new Date(); const pad=n=>String(n).padStart(2,"0"); const t=pad(d.getHours())+":"+pad(d.getMinutes()); if(d.toDateString()===n.toDateString()) return t; return pad(d.getMonth()+1)+"/"+pad(d.getDate())+" "+t; }
function copyMsg(btn){ const text=btn.getAttribute("data-text"); if(!text) return; navigator.clipboard.writeText(text).then(()=>{ btn.textContent="✅"; setTimeout(()=>btn.textContent="📋",1500); }).catch(()=>showToast("复制失败")); }

function fmt(t){
    let h=t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    // Auto-link URLs (before other formatting)
    h=h.replace(/(https?:\/\/[^\s<>\[\]{}|\\^`]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
    h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,"<pre><code>$2</code></pre>");
    h=h.replace(/`([^`]+)`/g,"<code>$1</code>");
    h=h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    h=h.replace(/\n/g,"<br>");
    return h;
}

async function _fetchHotNews(){
    // Try Weibo hot list API first
    try{
        const resp = await fetch("https://api.vvhan.com/api/hotlist?type=wbHot");
        if(resp.ok){
            const data = await resp.json();
            if(data.success && data.data && data.data.length>0){
                return _formatHotList("微博热搜", data.data.slice(0,10));
            }
        }
    }catch(e){}

    // Fallback: ask DeepSeek for a news summary
    if(apiKey){
        try{
            const prompt = "请以当前时间视角，列出10条左右近期全球重要热点事件，覆盖科技、经济、国际关系、社会等领域。每条格式：序号. 标题（15字以内）：一句话简述。像新闻聚合服务那样，只输出列表不要寒暄。";
            const text = await callDeepSeek(apiKey, "deepseek-v4-flash", [{role:"user",content:prompt}], "你是新闻聚合助手，输出简洁的新闻列表。");
            return _formatNewsText("今日热点", text);
        }catch(e){}
    }

    throw new Error("无法获取热点数据，请检查网络或设置API密钥");
}

function _formatHotList(source, items){
    let html = `<div class="hot-news-card"><div class="hn-header"><span class="hn-icon">📰</span><span class="hn-title">${esc(source)}</span></div><ul class="hn-list">`;
    items.forEach((item,i)=>{
        const rank = i<3 ? ` r${i+1}` : "";
        const title = item.title || item.word || "";
        const hot = item.hot || item.num || "";
        html += `<li class="hn-item"><span class="hn-rank${rank}">${i+1}</span><span class="hn-text">${esc(title)}</span>${hot?`<span class="hn-hot">🔥 ${esc(String(hot))}</span>`:""}</li>`;
    });
    html += "</ul></div>";
    return html;
}

function _formatNewsText(source, text){
    const lines = text.trim().split(/\n/).filter(l=>l.trim());
    let html = `<div class="hot-news-card"><div class="hn-header"><span class="hn-icon">📰</span><span class="hn-title">${esc(source)}</span></div><ul class="hn-list">`;
    lines.forEach((line,i)=>{
        const clean = line.replace(/^\d+[\.、)\s]+/,"").trim();
        if(!clean) return;
        html += `<li class="hn-item"><span class="hn-rank">${i+1}</span><span class="hn-text">${esc(clean)}</span></li>`;
    });
    html += "</ul></div>";
    return html;
}

// ============ DINO GAME ============
let dinoCtx, dinoAnimId, dinoState;
const DINO_W = 360, DINO_H = 200;

function startDinoGame(){
    const overlay = document.getElementById("dino-overlay");
    overlay.classList.remove("hidden");
    const canvas = document.getElementById("dino-canvas");
    canvas.width = DINO_W; canvas.height = DINO_H;
    dinoCtx = canvas.getContext("2d");

    dinoState = {
        x: 40, y: DINO_H - 40, vy: 0, grounded: true,
        obstacles: [], score: 0, over: false,
        speed: 3, tick: 0, best: parseInt(localStorage.getItem("ld_dino_best")||"0"),
    };

    canvas.addEventListener("click", dinoJump);
    document.addEventListener("keydown", dinoKey);
    document.getElementById("dino-best").textContent = dinoState.best;
    dinoAnimId = requestAnimationFrame(dinoLoop);
}

function stopDinoGame(){
    cancelAnimationFrame(dinoAnimId);
    const canvas = document.getElementById("dino-canvas");
    canvas.removeEventListener("click", dinoJump);
    document.removeEventListener("keydown", dinoKey);
    document.getElementById("dino-overlay").classList.add("hidden");
}

function dinoKey(e){ if(e.code === "Space" || e.code === "ArrowUp"){ e.preventDefault(); dinoJump(); } }

function dinoJump(){
    const s = dinoState;
    if(s.over){
        // Restart
        s.obstacles = []; s.score = 0; s.over = false; s.speed = 3; s.y = DINO_H - 40; s.vy = 0; s.grounded = true; s.tick = 0;
        document.getElementById("dino-best").textContent = s.best;
        return;
    }
    if(s.grounded){ s.vy = -9; s.grounded = false; }
}

function dinoLoop(){
    const s = dinoState, ctx = dinoCtx;
    ctx.clearRect(0, 0, DINO_W, DINO_H);

    // Ground
    ctx.fillStyle = "#404060";
    ctx.fillRect(0, DINO_H - 15, DINO_W, 2);

    // Physics
    if(!s.over){
        s.y += s.vy;
        s.vy += 0.5;
        if(s.y >= DINO_H - 40){ s.y = DINO_H - 40; s.vy = 0; s.grounded = true; }
        s.tick++;

        // Spawn obstacles
        if(s.tick % 70 === 0 || (s.tick > 300 && s.tick % 45 === 0)){
            const h = 16 + Math.random() * 18;
            s.obstacles.push({x: DINO_W, y: DINO_H - 30 - h, w: 10, h: h});
        }

        // Move obstacles
        for(const o of s.obstacles) o.x -= s.speed;
        s.obstacles = s.obstacles.filter(o => o.x > -20);

        // Speed up
        if(s.tick % 200 === 0) s.speed += 0.3;
        s.score++;
    }

    // Draw dinosaur
    const dx = s.x, dy = s.y;
    ctx.fillStyle = s.over ? "#888" : "#7c5cfc";
    // Body
    ctx.fillRect(dx - 6, dy - 20, 14, 22);
    // Head
    ctx.fillRect(dx + 2, dy - 26, 8, 8);
    // Eye
    ctx.fillStyle = "#fff";
    ctx.fillRect(dx + 5, dy - 24, 3, 3);
    // Legs
    ctx.fillStyle = s.over ? "#888" : "#7c5cfc";
    if(!s.grounded && !s.over){
        ctx.fillRect(dx - 6, dy + 2, 5, 6);
        ctx.fillRect(dx + 3, dy + 2, 5, 6);
    }else{
        const leg = Math.sin(s.tick * 0.3) * 3;
        ctx.fillRect(dx - 6, dy + 2, 5, 7 + leg);
        ctx.fillRect(dx + 3, dy + 2, 5, 7 - leg);
    }

    // Draw obstacles
    ctx.fillStyle = "#4ade80";
    for(const o of s.obstacles){
        ctx.fillRect(o.x, o.y, o.w, o.h);
        // Spikes on top
        ctx.fillStyle = "#2ea060";
        for(let i = 0; i < 3; i++){
            ctx.fillRect(o.x - 2 + i * 5, o.y - 5, 4, 6);
        }
        ctx.fillStyle = "#4ade80";
    }

    // Collision
    if(!s.over){
        const dr = {x: dx - 4, y: dy - 24, w: 16, h: 32};
        for(const o of s.obstacles){
            if(dr.x < o.x + o.w && dr.x + dr.w > o.x && dr.y < o.y + o.h && dr.y + dr.h > o.y){
                s.over = true;
                if(s.score > s.best){
                    s.best = s.score;
                    localStorage.setItem("ld_dino_best", s.best);
                    document.getElementById("dino-best").textContent = s.best;
                }
                break;
            }
        }
    }

    // Score
    const realScore = Math.floor(s.score / 5);
    document.getElementById("dino-score").textContent = (s.over ? "💀 " : "🦖 ") + "得分：" + realScore;

    // Game over overlay
    if(s.over){
        ctx.fillStyle = "rgba(0,0,0,.5)";
        ctx.fillRect(0, 0, DINO_W, DINO_H);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 18px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("游戏结束", DINO_W/2, DINO_H/2 - 10);
        ctx.font = "13px -apple-system, sans-serif";
        ctx.fillText("点击重新开始", DINO_W/2, DINO_H/2 + 18);
        ctx.textAlign = "start";
    }

    dinoAnimId = requestAnimationFrame(dinoLoop);
}

async function sendMessage(content){
    if(isLoading) return;
    const input=document.getElementById("msg-input");
    const text=content||input.value.trim();
    const hasPhoto = !!photoData;
    if(!text && !hasPhoto) return;
    if(!apiKey){ showToast("请先点⚙️设置API密钥"); openSettings(); return; }

    if(!activeCid || !getActiveConv()) newConversation();

    isLoading=true;
    document.getElementById("send-btn").disabled=true;
    const currentPhoto = photoData;
    photoData = null;
    document.getElementById("cam-btn").textContent = "📷";
    document.getElementById("msg-input").placeholder = "和聪明蛋说点什么...";
    input.value=""; input.style.height="auto";
    document.getElementById("mode-indicator").textContent="";
    const welcome=document.getElementById("welcome-box");
    if(welcome) welcome.style.display="none";

    const displayText = text || (hasPhoto ? "帮我看看这张图片" : "");
    const useModel = smartSwitch ? detectMode(displayText) : model;
    if(smartSwitch && useModel!==model){
        showToast(useModel==="deepseek-v4-pro"?"🧠 自动切到V4 Pro深度思考":"💬 自动切到V4 Flash");
    }

    const conv = getActiveConv();
    if(conv && conv.messages.length===0){ conv.title = autoTitle(displayText); saveConvs(); renderSidebar(); }

    // Weather check
    let weatherData = null;
    if(WEATHER_KW.test(displayText)) weatherData = await checkWeather(displayText);

    const msgObj = {role:"user",content:displayText,time:Date.now()};
    if(currentPhoto){ msgObj.image = currentPhoto.base64; msgObj.content = text || "请描述这张图片"; }
    if(weatherData) msgObj.weather = weatherData;
    conv.messages.push(msgObj);
    saveConvs(); renderChat();

    showTyping();
    let sys = systemPrompt || PERSONALITIES[currentPersonality].prompt;
    const memCtx = getMemoryContext();
    if(memCtx) sys = sys + "\n\n" + memCtx;
    // Game context
    const gameCtx = getGameContext();
    if(gameCtx) sys = sys + "\n\n" + gameCtx;
    if(weatherData){
        sys = sys + `\n\n[用户查询了${weatherData.city}的天气：当前${weatherData.temp}°C，${weatherData.desc}，湿度${weatherData.humidity}%，体感温度${weatherData.feels_like}°C。请在回复中自然地告诉用户这些天气信息。]`;
    }
    // Check for stop game command
    if(activeGame && /结束游戏|退出游戏|不玩了|停止游戏/.test(displayText)){
        activeGame = null; saveGameState();
        document.getElementById("game-bar").classList.add("hidden");
    }

    try{
        const chatMsgs = conv.messages.map(m=>({role:m.role,content:m.content,image:m.image||null}));
        const reply = await callDeepSeek(apiKey, useModel, chatMsgs, sys);
        removeTyping();
        conv.messages.push({role:"assistant",content:reply,time:Date.now()});
        extractAndSaveMemory(displayText, reply);
        saveConvs(); renderChat(); renderSidebar();
    }catch(err){
        removeTyping();
        conv.messages.push({role:"assistant",content:"😅 出错了："+err.message,time:Date.now()});
        saveConvs(); renderChat();
    }
    isLoading=false;
    document.getElementById("send-btn").disabled=false;
    updateBadge();
}

function sendQuick(t){ document.getElementById("msg-input").value=t; sendMessage(t); }
function handlePhoto(e){
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 50*1024*1024){ showToast("图片不能超过50MB"); return; }
    const img = new Image();
    img.onload = function(){
        const maxW = 512, maxH = 512;
        let w = img.width, h = img.height;
        if(w > maxW || h > maxH){
            const r = Math.min(maxW/w, maxH/h);
            w = Math.round(w*r); h = Math.round(h*r);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(img.src);
        photoData = { base64: canvas.toDataURL("image/jpeg", 0.7), mime: "image/jpeg" };
        document.getElementById("cam-btn").textContent = "📸";
        document.getElementById("msg-input").placeholder = "描述这张图片（或直接发送）...";
        document.getElementById("msg-input").focus();
    };
    e.target.value = "";
}
function cancelPhoto(){
    photoData = null;
    document.getElementById("cam-btn").textContent = "📷";
    document.getElementById("msg-input").placeholder = "和聪明蛋说点什么...";
}
