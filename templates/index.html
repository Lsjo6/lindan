<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="霖蛋">
    <meta name="theme-color" content="#0f0f1a">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <title>霖蛋 - 你的AI助手</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0f1a;
            --surface: #1a1a2e;
            --surface2: #222240;
            --text: #e0e0e8;
            --text2: #9090a8;
            --accent: #7c5cfc;
            --accent2: #5b3dd4;
            --user-bubble: #2d2d5e;
            --ai-bubble: #16162a;
            --border: #2a2a45;
            --danger: #e0556a;
            --input-bg: #1a1a2e;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        /* ---- Header ---- */
        header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #4cc9f0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
        }

        .header-subtitle {
            font-size: 11px;
            color: var(--text2);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: var(--surface2);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .icon-btn:active {
            background: var(--border);
        }

        /* ---- Chat ---- */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 8px;
            max-width: 90%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.assistant {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }
        .message.user .msg-avatar {
            background: linear-gradient(135deg, #4cc9f0, #4895ef);
        }
        .message.assistant .msg-avatar {
            background: linear-gradient(135deg, #7c5cfc, #f72585);
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.55;
            word-break: break-word;
            position: relative;
        }
        .message.user .msg-bubble {
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }
        .message.assistant .msg-bubble {
            background: var(--ai-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .msg-bubble p { margin: 0 0 6px; }
        .msg-bubble p:last-child { margin: 0; }
        .msg-bubble code {
            background: rgba(255,255,255,0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        .msg-bubble pre {
            background: rgba(0,0,0,0.3);
            padding: 10px 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 6px 0;
            font-size: 13px;
            line-height: 1.4;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }
        .typing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text2);
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* ---- Welcome ---- */
        .welcome {
            text-align: center;
            padding: 40px 16px 20px;
            color: var(--text2);
        }
        .welcome-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }
        .welcome h2 {
            font-size: 22px;
            color: var(--text);
            margin-bottom: 6px;
        }
        .welcome p {
            font-size: 14px;
            line-height: 1.5;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
        }
        .quick-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .quick-btn:active {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* ---- Input ---- */
        #input-area {
            padding: 10px 14px 16px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }
        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        #msg-input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 120px;
            line-height: 1.4;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        #msg-input:focus {
            border-color: var(--accent);
        }
        #send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        #send-btn:active {
            background: var(--accent2);
            transform: scale(0.95);
        }
        #send-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        /* ---- Settings Modal ---- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal {
            background: var(--surface);
            border-radius: 20px 20px 0 0;
            padding: 20px 20px 30px;
            width: 100%;
            max-width: 500px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }
        .modal h3 {
            font-size: 18px;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal label {
            font-size: 13px;
            color: var(--text2);
            display: block;
            margin-bottom: 6px;
        }
        .modal input, .modal textarea, .modal select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            margin-bottom: 14px;
            resize: vertical;
        }
        .modal input:focus, .modal select:focus {
            border-color: var(--accent);
        }
        .modal .btn-row {
            display: flex;
            gap: 10px;
        }
        .modal .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:active { background: var(--accent2); }
        .btn-secondary {
            background: var(--surface2);
            color: var(--text);
        }
        .btn-secondary:active { background: var(--border); }

        .tip {
            font-size: 12px;
            color: var(--text2);
            text-align: center;
            margin-top: 8px;
        }

        /* ---- Toast ---- */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 200;
            animation: fadeIn 0.3s ease;
            pointer-events: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="header-left">
                <div class="avatar">🥚</div>
                <div>
                    <div class="header-title">霖蛋</div>
                    <div class="header-subtitle" id="status-text">在线</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="clearChat()" title="清空对话">🗑️</button>
                <button class="icon-btn" onclick="openSettings()" title="设置">⚙️</button>
            </div>
        </header>

        <!-- Chat -->
        <div id="chat-container">
            <div class="welcome" id="welcome-box">
                <div class="welcome-icon">🥚</div>
                <h2>你好，我是霖蛋</h2>
                <p>你的全能AI助手，陪你聊天、帮你学习、为你解答</p>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="sendQuick('今天心情不好，陪我聊聊')">💭 陪我聊天</button>
                    <button class="quick-btn" onclick="sendQuick('帮我写一段文案')">✍️ 帮我写作</button>
                    <button class="quick-btn" onclick="sendQuick('给我推荐3本好书')">📚 推荐好书</button>
                    <button class="quick-btn" onclick="sendQuick('帮我规划今天要做的事')">📋 帮我规划</button>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div id="input-area">
            <div class="input-row">
                <textarea id="msg-input" rows="1" placeholder="和霖蛋说点什么..." oninput="autoResize(this)"></textarea>
                <button id="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div class="modal-overlay hidden" id="settings-modal">
            <div class="modal">
                <h3>⚙️ 设置</h3>
                <label>AI 引擎</label>
                <select id="provider-select">
                    <option value="deepseek">DeepSeek（推荐，国内直接用）</option>
                    <option value="anthropic">Claude（需要代理/VPN）</option>
                </select>
                <label>API 密钥</label>
                <input type="password" id="api-key-input" placeholder="sk-...">
                <label>自定义提示词（选填）</label>
                <textarea id="system-prompt-input" rows="2" placeholder="给霖蛋的性格设定..."></textarea>
                <div class="btn-row">
                    <button class="btn btn-secondary" onclick="closeSettings()">取消</button>
                    <button class="btn btn-primary" onclick="saveSettings()">保存</button>
                </div>
                <div class="tip">DeepSeek 密钥从 platform.deepseek.com 获取，支持支付宝/微信充值</div>
            </div>
        </div>
    </div>

    <script>
        // ---- State ----
        let messages = [];
        let apiKey = "";
        let provider = "deepseek";
        let systemPrompt = "";
        let isLoading = false;

        // ---- Init ----
        function init() {
            apiKey = localStorage.getItem("ld_api_key") || "";
            provider = localStorage.getItem("ld_provider") || "deepseek";
            systemPrompt = localStorage.getItem("ld_system") || "";
            const saved = localStorage.getItem("ld_messages");
            if (saved) {
                try { messages = JSON.parse(saved); } catch(e) { messages = []; }
            }
            if (apiKey && !document.getElementById("api-key-input").value) {
                document.getElementById("api-key-input").value = apiKey;
            }
            if (systemPrompt) {
                document.getElementById("system-prompt-input").value = systemPrompt;
            }
            document.getElementById("provider-select").value = provider;
            renderChat();
            document.getElementById("msg-input").addEventListener("keydown", function(e) {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            updateStatus();
        }

        function updateStatus() {
            document.getElementById("status-text").textContent = apiKey ? "在线" : "请先设置API密钥";
        }

        // ---- Save / Load ----
        function saveChat() {
            // 只保留最近50条
            const toSave = messages.slice(-50);
            localStorage.setItem("ld_messages", JSON.stringify(toSave));
        }

        // ---- Render ----
        function renderChat() {
            const container = document.getElementById("chat-container");
            const welcome = document.getElementById("welcome-box");

            // Clear existing messages (keep welcome)
            container.querySelectorAll(".message").forEach(el => el.remove());

            if (messages.length === 0) {
                if (!welcome) {
                    const w = document.createElement("div"); w.className = "welcome"; w.id = "welcome-box";
                    w.innerHTML = `<div class="welcome-icon">🥚</div><h2>你好，我是霖蛋</h2><p>你的全能AI助手，陪你聊天、帮你学习、为你解答</p><div class="quick-actions">${document.querySelector(".quick-actions")?.outerHTML || ""}</div>`;
                    container.appendChild(w);
                }
            } else {
                if (welcome) welcome.style.display = "none";
                messages.forEach((m, i) => {
                    const div = document.createElement("div");
                    div.className = `message ${m.role}`;
                    div.innerHTML = `
                        <div class="msg-avatar">${m.role === "user" ? "😊" : "🥚"}</div>
                        <div class="msg-bubble">${formatContent(m.content)}</div>
                    `;
                    container.appendChild(div);
                });
            }
            container.scrollTop = container.scrollHeight;
        }

        function formatContent(text) {
            // 简单 Markdown: 处理代码块和换行
            let html = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            // 代码块
            html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, "<pre><code>$2</code></pre>");
            // 行内代码
            html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
            // 粗体
            html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
            // 换行
            html = html.replace(/\n/g, "<br>");
            return html;
        }

        // ---- Loading ----
        function showTyping() {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = "message assistant";
            div.id = "typing-indicator";
            div.innerHTML = `
                <div class="msg-avatar">🥚</div>
                <div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById("typing-indicator");
            if (el) el.remove();
        }

        // ---- Send ----
        async function sendMessage(content) {
            if (isLoading) return;
            const input = document.getElementById("msg-input");
            const text = content || input.value.trim();
            if (!text) return;

            if (!apiKey) {
                showToast("请先点击右上角 ⚙️ 设置 API 密钥");
                openSettings();
                return;
            }

            isLoading = true;
            document.getElementById("send-btn").disabled = true;
            input.value = "";
            input.style.height = "auto";

            // Hide welcome
            const welcome = document.getElementById("welcome-box");
            if (welcome) welcome.style.display = "none";

            // Add user message
            messages.push({ role: "user", content: text });
            renderChat();
            saveChat();
            showTyping();

            try {
                const resp = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        api_key: apiKey,
                        provider: provider,
                        messages: messages,
                        system: systemPrompt,
                    }),
                });

                const data = await resp.json();
                removeTyping();

                if (data.error) {
                    messages.push({ role: "assistant", content: "😅 出错了：" + data.error });
                } else {
                    messages.push({ role: "assistant", content: data.reply });
                }

                renderChat();
                saveChat();
            } catch (err) {
                removeTyping();
                messages.push({ role: "assistant", content: "😅 网络错误，请检查网络后重试。" });
                renderChat();
                saveChat();
            }

            isLoading = false;
            document.getElementById("send-btn").disabled = false;
        }

        function sendQuick(text) {
            document.getElementById("msg-input").value = text;
            sendMessage(text);
        }

        function autoResize(el) {
            el.style.height = "auto";
            el.style.height = Math.min(el.scrollHeight, 120) + "px";
        }

        // ---- Clear ----
        function clearChat() {
            if (messages.length === 0) return;
            if (confirm("确定要清空所有对话吗？")) {
                messages = [];
                localStorage.removeItem("ld_messages");
                renderChat();
                document.getElementById("welcome-box").style.display = "";
                showToast("对话已清空");
            }
        }

        // ---- Settings ----
        function openSettings() {
            document.getElementById("api-key-input").value = apiKey;
            document.getElementById("provider-select").value = provider;
            document.getElementById("system-prompt-input").value = systemPrompt;
            document.getElementById("settings-modal").classList.remove("hidden");
        }

        function closeSettings() {
            document.getElementById("settings-modal").classList.add("hidden");
        }

        function saveSettings() {
            apiKey = document.getElementById("api-key-input").value.trim();
            provider = document.getElementById("provider-select").value;
            systemPrompt = document.getElementById("system-prompt-input").value.trim();
            localStorage.setItem("ld_api_key", apiKey);
            localStorage.setItem("ld_provider", provider);
            localStorage.setItem("ld_system", systemPrompt);
            updateStatus();
            closeSettings();
            showToast("设置已保存 ✓");
        }

        // ---- Toast ----
        function showToast(msg) {
            const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        // ---- PWA ----
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/static/sw.js").catch(() => {});
        }

        // ---- Start ----
        init();
    </script>
</body>
</html>
